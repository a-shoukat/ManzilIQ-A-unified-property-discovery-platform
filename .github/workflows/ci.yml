name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Repo locks with bun.lock (no package-lock.json). npm cache: failed setup-node.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Full-repo eslint still has pre-existing Prettier debt (thousands of errors).
      # Keep typecheck/tests/build as the green gates for this project.
      - run: bunx vitest run
      - run: bunx tsc --noEmit
      - run: bun run build
